# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-contract-rust"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-contract-rust"
description = "Content contract authored as a loadable Rust module over the Xmip ABI: the entrypoint, the contract table and the lifecycle a Rust author starts from. A xmip-core-contract technology."
publish = false

[lib]
path = "src/lib.rs"
# A loadable module for the host, and a library so the tests can drive the
# entrypoint without a loader.
crate-type = ["cdylib", "rlib"]

[dependencies]
# What a provider builds against: the contract trait, and the export that gives
# this crate its entry point and table, and the Stream it judges; the only
# Xmip crate a provider depends on (ADR-0061).
sdk = { package = "xmip-core-sdk", git = "https://github.com/IlleNilsson/xmip-core-sdk", branch = "main" }

[lints.rust]
# A provider's crate writes no unsafe: the SDK's export stands on the C
# boundary for it (ADR-0061, decision 8).
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
